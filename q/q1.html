    <style>
        /* Spinner for Audio Playback */
        .playaudio {

        position: relative;
        }
        .playaudio::after,
        .playaudio::before {
        content: '';

  <script>

    /* define parameters */
    //initialize Experiment
    const jsPsych = initJsPsych({
        /* on_finish: function() {
        jsPsych.data.displayData();
      } */
    });

    // SONA & subject ID
    let sona_id = jsPsych.data.urlVariables()['sonaid'];
    
    if(!sona_id){
        var subject_id = jsPsych.randomization.randomID(16);
    } else {
        var subject_id = sona_id;
        var TXT_ending = 
            '<hr><p><a href="https://lmu-psy.sona-systems.com/webstudy_credit.aspx?experiment_id=261&credit_token=c7e045b2f2b545b996b9c3148b21530d&survey_code=' + subject_id + '">Klicken Sie bitte hier, um Ihre Versuchspersonenstunde in SONA zu erhalten.</a></p>';
  }

    // specify starting time
    var start_time = new Date();

    // add to data file
    jsPsych.data.addProperties({ 
        subject: subject_id, 
        time: start_time.toISOString()
    });


    /*
    // consent to participate.
        var check_consent = function(elem) {
        if (document.getElementById('consent_checkbox').checked) {
            return true;
        }
        else {
            alert("If you wish to participate, you must check the box next to the statement 'I agree to participate in this study.'");
            return false;
        }
        return false;
    };

    // declare the block.
    var informedConsent = {
        type: jsPsychExternalHtml,
        url: "../consent/pana_consent.html",
        cont_btn: "start",
        check_fn: check_consent
    };*/

    /* welcome message & instructions */
    var welcome = {
        type: jsPsychInstructions,
        data: { test_part: "instruction" },
        pages: [
            `<p style="font-weight:bold;">Welcome to the research project "Ganzfeld"!</p>
            <p>In this first session, we would like to ask you to fill out some questionnaires and participate in a relaxation exercise.</p>
            <p>Please click <i>Next</i> to begin by providing some information about you.</p>`
            ],
        show_clickable_nav: true
    };


    /* Surveys */
    /* The Boundary Questionnaire */
    var surveyBQ = {
        type: jsPsychSurvey,
        data: { test_part: "BQ" },
        pages: [
        [
            {
                type: 'html',
                name: 'BQIntro',
                prompt: '<p>Please rate each of the statements from 0 to 4 (0 indicates <i>"not at all true of me"</i>; 4 indicates <i>"very true of me"</i>).  Try to respond to all of the statements as quickly as you can.</p>',
            },
            {
                type: 'likert-table',
                name: 'BQ',
                prompt: ' ',
                statements: [
                {prompt: 'My feelings blend into one another.', name: 'BQ01'},
                {prompt: 'I am very close to my childhood feelings.', name: 'BQ02'},
                {prompt: 'I am easily hurt.', name: 'BQ03'},
                {prompt: 'I spend a lot of time daydreaming, fantasizing or in reverie.', name: 'BQ04'},
                {prompt: 'Sometimes it\'s scary when one gets too involved with another person.', name: 'BQ05'},
                {prompt: 'A good parent has to be a bit of a child, too.', name: 'BQ06'},
                {prompt: 'I can easily imagine myself as an animal or what it might be like to be an animal.', name: 'BQ07'},
                {prompt: 'When I work on a project, I don\'t like to tie myself down to a definite outline.  I rather like to let my mind wander.', name: 'BQ08'},
                {prompt: 'In my dreams, people sometimes merge into each other or become other people.', name: 'BQ09'},
                {prompt: 'I believe I am influenced by forces that no one can understand.', name: 'BQ10'},
                {prompt: 'There are no sharp dividing lines between normal people, people with problems and people who are considered psychotic or crazy.', name: 'BQ11'},
                {prompt: 'I think I would enjoy being some kind of creative artist.', name: 'BQ12'},
                {prompt: 'I have had the experience of someone calling me or speaking my name and not being sure whether it was really happening or whether I was imagining it.', name: 'BQ13'}
                ],
                options: ['0', '1', '2', '3', '4'],
                required: true
            }
        ]
        ],
        button_label_finish: 'Next'
    };

    /* The Tellegen Absorption Scale */
    var surveyTAS = {
        type: jsPsychSurvey,
        data: { test_part: "TAS" },
        pages: [
        [
            {
                type: 'html',
                name: 'TASIntro',
                prompt: `
                <p>This questionnaire consists of questions about experiences that you may have had in your life. We are interested in how often you have these experiences. It is important, however, that your answers show how often these experiences happen to you when you are not under the influence of alcohol or drugs.</p>
                <p>Please indicate whether each statement applies to you by using the following response scale:</p>
                <ul>
                    <li>1=strongly disagree</li>
                    <li>2=moderately disagree</li>
                    <li>3=slightly disagree</li>
                    <li>4=slightly agree</li>
                    <li>5=moderately agree</li>
                    <li>6=strongly agree</li>
                </ul>`
            },
            {
                type: 'likert-table',
                name: 'TAS',
                prompt: ' ',
                statements: [
                {prompt: 'Sometimes I feel and experience things as I did as a child.', name: 'TAS01'},
                {prompt: 'I can be greatly moved by eloquent or poetic language.', name: 'TAS02'},
                {prompt: 'While watching a movie, a TV show, or a play, I may become so involved that I may forget about myself and my surroundings and experience the story as if it were real and as if I were taking part in it.', name: 'TAS03'},
                {prompt: 'If I stare at a picture and then look away from it, I can sometimes “see” an image of the picture almost as if I were still looking at it.', name: 'TAS04'},
                {prompt: 'Sometimes I feel as if my mind could envelop the whole world.', name: 'TAS05'},
                {prompt: 'I like to watch cloud shapes change in the sky.', name: 'TAS06'},
                {prompt: 'If I wish, I can imagine (or daydream) some things so vividly that they hold my attention as a good movie or story does.', name: 'TAS07'},
                {prompt: 'I think I really know what some people mean when they talk about mystical experiences.', name: 'TAS08'},
                {prompt: 'I sometimes “step outside” my usual self and experience an entirely different state of being.', name: 'TAS09'},
                {prompt: 'Textures—such as wool, sand, wood—sometimes remind me of colors or music.', name: 'TAS10'},
                {prompt: 'Sometimes I experience things as if they were “doubly” real.', name: 'TAS11'},
                {prompt: 'When I listen to music I can get so caught up in it that I don\'t notice anything else.', name: 'TAS12'},
                {prompt: 'If I wish I can imagine that my body is so heavy that I could not move it if I wanted to.', name: 'TAS13'},
                {prompt: 'I can often somehow sense the presence of another person before I actually see or hear her/him.', name: 'TAS14'},
                {prompt: 'The crackle and flames of a wood fire stimulate my imagination.', name: 'TAS15'},
                {prompt: 'It is sometimes possible for me to be completely immersed in nature or art and to feel as if my whole state of consciousness has somehow been temporarily altered.', name: 'TAS16'},
                {prompt: 'Different colors have distinctive and special meanings for me.', name: 'TAS17'},
                {prompt: 'I am able to wander off into my thoughts while doing a routine task and then find a few minutes later that I have completed it.', name: 'TAS18'},
                {prompt: 'I can sometimes recollect certain past experiences in my life with such clarity and vividness that it is like living them again or almost so.', name: 'TAS19'},
                {prompt: 'Things that might seem meaningless to others often make sense to me.', name: 'TAS20'},
                {prompt: 'While acting in a play I think I could really feel the emotions of the character and “become” her/him for the time being, forgetting both myself and the audience.', name: 'TAS21'},
                {prompt: 'My thoughts often don\'t occur as words but as visual images.', name: 'TAS22'},
                {prompt: 'I often take delight in small things (like the five-pointed star shape that appears when you cut an apple across the core or the colors in soap bubbles).', name: 'TAS23'},
                {prompt: 'When listening to organ music or other powerful music I sometimes feel as if I am being lifted into the air.', name: 'TAS24'},
                {prompt: 'Sometimes I can change noise into music by the way I listen to it.', name: 'TAS25'},
                {prompt: 'Some of my most vivid memories are called up by scents and smells.', name: 'TAS26'},
                {prompt: 'Some music reminds me of pictures or changing color patterns.', name: 'TAS27'},
                {prompt: 'I often know what someone is going to say before he or she says it.', name: 'TAS28'},
                {prompt: 'I often have “physical memories”: for example, after I have been swimming I may still feel as if I am in the water.', name: 'TAS29'},
                {prompt: 'The sound of a voice can be so fascinating to me that I can just go on listening to it.', name: 'TAS30'},
                {prompt: 'At times I somehow feel the presence of someone who is not physically there.', name: 'TAS31'},
                {prompt: 'Sometimes thoughts and images come to me without the slightest effort on my part.', name: 'TAS32'},
                {prompt: 'I find that different odors have different colors.', name: 'TAS33'},
                {prompt: 'I can be deeply moved by a sunset.', name: 'TAS34'},
                ],
                options: ['1', '2', '3', '4', '5', '6'],
                required: true
            }
        ]
        ],
        button_label_finish: 'Next'
    };

    /* The Big Five Inventory */
    var surveyBFI2 = {
        type: jsPsychSurvey,
        data: { test_part: "BFI2" },
        pages: [
        [
            {
                type: 'html',
                name: 'BFIIntro',
                prompt: '<p>Here are a number of characteristics that may or may not apply to you. For example, do you agree that you are someone who likes to spend time with others? Please write a number next to each statement to indicate the extent to which you agree or disagree with that statement.</p>',
            },
            {
                type: 'likert-table',
                name: 'BFI',
                prompt: 'I am someone who...',
                statements: [
                {prompt: 'Sometimes I feel and experience things as I did as a child.', name: 'BFI01'},
                {prompt: 'I can be greatly moved by eloquent or poetic language.', name: 'BFI02'},
                {prompt: 'While watching a movie, a TV show, or a play, I may become so involved that I may forget about myself and my surroundings and experience the story as if it were real and as if I were taking part in it.', name: 'BFI03'},
                {prompt: 'If I stare at a picture and then look away from it, I can sometimes “see” an image of the picture almost as if I were still looking at it.', name: 'BFI04'},
                {prompt: 'Sometimes I feel as if my mind could envelop the whole world.', name: 'BFI05'},
                {prompt: 'I like to watch cloud shapes change in the sky.', name: 'BFI06'},
                {prompt: 'If I wish, I can imagine (or daydream) some things so vividly that they hold my attention as a good movie or story does.', name: 'BFI07'},
                {prompt: 'I think I really know what some people mean when they talk about mystical experiences.', name: 'BFI08'},
                {prompt: 'I sometimes “step outside” my usual self and experience an entirely different state of being.', name: 'BFI09'},
                {prompt: 'Textures—such as wool, sand, wood—sometimes remind me of colors or music.', name: 'BFI10'},
                {prompt: 'Sometimes I experience things as if they were “doubly” real.', name: 'BFI11'},
                {prompt: 'When I listen to music I can get so caught up in it that I don\'t notice anything else.', name: 'BFI12'},
                {prompt: 'If I wish I can imagine that my body is so heavy that I could not move it if I wanted to.', name: 'BFI13'},
                {prompt: 'I can often somehow sense the presence of another person before I actually see or hear her/him.', name: 'BFI14'},
                {prompt: 'The crackle and flames of a wood fire stimulate my imagination.', name: 'BFI15'},
                {prompt: 'It is sometimes possible for me to be completely immersed in nature or art and to feel as if my whole state of consciousness has somehow been temporarily altered.', name: 'BFI16'},
                {prompt: 'Different colors have distinctive and special meanings for me.', name: 'BFI17'},
                {prompt: 'I am able to wander off into my thoughts while doing a routine task and then find a few minutes later that I have completed it.', name: 'BFI18'},
                {prompt: 'I can sometimes recollect certain past experiences in my life with such clarity and vividness that it is like living them again or almost so.', name: 'BFI19'},
                {prompt: 'Things that might seem meaningless to others often make sense to me.', name: 'BFI20'},
                {prompt: 'While acting in a play I think I could really feel the emotions of the character and “become” her/him for the time being, forgetting both myself and the audience.', name: 'BFI21'},
                {prompt: 'My thoughts often don\'t occur as words but as visual images.', name: 'BFI22'},
                {prompt: 'I often take delight in small things (like the five-pointed star shape that appears when you cut an apple across the core or the colors in soap bubbles).', name: 'BFI23'},
                {prompt: 'When listening to organ music or other powerful music I sometimes feel as if I am being lifted into the air.', name: 'BFI24'},
                ],
                options: ['1', '2', '3', '4', '5', '6'],
                required: true
            }
        ]
        ],
        button_label_finish: 'Next'
    };

    /* The Dissociative Experiences Scale */
    var surveyDESScaleValues = [
                {value: '0%'},
                {value: '10%'},
                {value: '20%'},
                {value: '30%'},
                {value: '40%'},
                {value: '50%'},
                {value: '60%'},
                {value: '70%'},
                {value: '80%'},
                {value: '90%'},
                {value: '100%'},
                ];

                var surveyDES = {
        type: jsPsychSurvey,
        data: { test_part: "DES" },
        pages: [
        [
            {
                type: 'html',
                name: 'DESIntro',
                prompt: '<p>This questionnaire consists of twenty eight questions about experiences that you may have in your daily life.  We are interested in how often you have had these experiences during the last two weeks.  It is important, however, that your answers show how often these experiences happen to you when you are not under the influence of alcohol or drugs.  To answer the questions, please determine to what degree the experience described in the question applies to you and mark the square to show what percentage of the time you have the experience.</p>',
            },
            {
                type: 'likert',
                name: 'DES1',
                prompt: '1.	Some people have the experience of driving or riding in a car or bus or subway and suddenly realizing that they don\'t remember what has happened during all or part of the trip. Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES2',
                prompt: '2.	Some people find that sometimes they are listening to someone talk and they suddenly realize that they did not hear part or all of what was said. Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES3',
                prompt: '3.	Some people have the experience of finding themselves in a place and having no idea how they got there. Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES4',
                prompt: '4.	Some people have the experience of finding themselves dressed in clothes that they don\'t remember putting on. Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES5',
                prompt: '5.	Some people have the experience of finding new things among their belongings that they do not remember buying. Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES6',
                prompt: '6.	Some people sometimes find that they are approached by people whom they do not know, who call them by another name or insist that they have met them before. Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES7',
                prompt: '7.	Some people sometimes have the experience of feeling as though they are standing next to themselves or watching themselves do something and they actually see themselves as if they were looking at another person. Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES8',
                prompt: '8.	Some people are told that they sometimes do not recognize friends or family members. Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES9',
                prompt: '9.	Some people find that they have no memory for some important events in their lives (for example, a wedding or graduation). Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES10',
                prompt: '10. Some people have the experience of being accused of lying when they do not think that they have lied. Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES11',
                prompt: '11. Some people have the experience of looking in a mirror and not recognizing themselves. Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES12',
                prompt: '12. Some people have the experience of feeling that other people, objects, and the world around them are not real. Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES13',
                prompt: '13. Some people have the experience of feeling that their body does not seem to belong to them. Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES14',
                prompt: '14. Some people have the experience of sometimes remembering a past event so vividly that they feel as if they were reliving that event. Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES15',
                prompt: '15. Some people have the experience of not being sure whether things that they remember happening really did happen or whether they just dreamed them. Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES16',
                prompt: '16. Some people have the experience of being in a familiar place but finding it strange and unfamiliar. Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES17',
                prompt: '17. Some people find that when they are watching television or a movie they become so absorbed in the story that they are unaware of other events happening around them. Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES18',
                prompt: '18. Some people find that they become so involved in a fantasy or daydream that it feels as though it were really happening to them. Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES19',
                prompt: '19. Some people find that they sometimes are able to ignore pain. Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES20',
                prompt: '20. Some people find that they sometimes sit staring off into space, thinking of nothing, and are not aware of the passage of time. Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES21',
                prompt: '21. Some people sometimes find that when they are alone they talk out loud to themselves. Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES22',
                prompt: '22. Some people find that in one situation they may act so differently compared with another situation that they feel almost as if they were two different people. Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES23',
                prompt: '23. Some people sometimes find that in certain situations they are able to do things with amazing ease and spontaneity that would usually be difficult for them (for example, sports, work, social situation, etc.). Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES24',
                prompt: '24. Some people sometimes find that they cannot remember whether they have done something or have just thought about doing that thing (for example, not knowing whether they have mailed a letter or have just thought about mailing it). Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES25',
                prompt: '25. Some people find evidence that they have done things that they do not remember doing. Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES26',
                prompt: '26. Some people sometimes find writings, drawings, or notes among their belongings that they must have done but cannot remember doing. Please indicate the percentage of the time this happens to you.',
                likert_scale_min_label: 'Never',
                likert_scale_max_label: 'Always',
                likert_scale_values: surveyDESScaleValues,
                required: true
            },
            {
                type: 'likert',
                name: 'DES27',
                prompt: '27. Some people sometimes find that they hear voices inside their head that tell them to do things or comment on things that they are doing. Please indicate the percentage of the time this happens to you.',
