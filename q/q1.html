        }
        .playaudio::after,
        .playaudio::before {
        content: '';  
        box-sizing: border-box;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid #000;
        position: absolute;
        left: 0;
        top: 0;
        animation: animloader 2s linear infinite;
        }
        .playaudio::after {
        animation-delay: 1s;
        }

        @keyframes animloader {
        0% {
            transform: scale(0);
            opacity: 1;
        }
