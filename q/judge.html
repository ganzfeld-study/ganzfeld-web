<html>
  <head>
    <meta charset="utf-8" />
    <title>Ganzfeld 2</title>

    <script src="jspsych/plugin-preload.js"></script>
    <!--<script src="jspsych/plugin-fullscreen.js"></script>-->

    <script src="jspsych/plugin-survey.js"></script>
    <script src="jspsych/plugin-survey-multi-choice.js"></script>
    <script src="jspsych/plugin-survey-text.js"></script>

    <script src="jspsych/plugin-html-keyboard-response.js"></script>

    <link href="jspsych/jspsych.css" rel="stylesheet" type="text/css" />
    <!--<link rel="stylesheet" href="https://unpkg.com/@jspsych/plugin-survey@0.2.1/css/survey.css">-->
    <link rel="stylesheet" href="jspsych/survey.css"></link>
    <!--<link rel="stylesheet" href="consent/consent.css"></link>-->

    <style>
        .jspsych-slider {
            min-width: 40em;
        }


        /* Video */
        .video-rating-container {
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
        }
        .video-container {
            margin-right: 2rem;
            height: 33vh; /* Set a fixed height */
            margin-bottom: 1rem;
        }
        video {
            width: 100%;
            height: 100%; /* Ensure the video fills its container */
        }
        .slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width:100%;
            margin-bottom: 1rem;
        }
        .slider-container input[type="range"] {
            width: 80%;
        }
        output {
            margin-top: 0.5rem;
        }
        datalist {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            width: 80%;
        }
        option {
            padding: 0;
        }

    </style>

  </head>
  <body></body>
  <script>

    /* define parameters */
    //initialize Experiment
    const jsPsych = initJsPsych({
        on_finish: function() {
        jsPsych.data.displayData();
      }
    });

    // SONA & subject ID
    let pid = jsPsych.data.urlVariables()['pid'];
    let videoSet = jsPsych.data.urlVariables()['vs'];
    
    var subject_id = jsPsych.randomization.randomID(16);


    // specify starting time
    var start_time = new Date();

    // add to data file
    jsPsych.data.addProperties({ 
        judge: subject_id,
        subject: pid, 
        time: start_time.toISOString()
    });


    /* welcome message & instructions */
    var welcome = {
        type: jsPsychSurveyText,
        data: { test_part: 'welcome'},
        preamble: `<h2>Judging</h2>
            <p>Please make sure that participant ID and video set are correct.</p>`,
        questions: [
            {prompt: 'Participant ID', name: 'pid', required: true},
            {prompt: 'Video Set', name: 'videoSet', required: true}
        ],
        button_label: 'Continue',
        on_load: function(){
            if(pid) document.getElementById('input-0').setAttribute('value', pid);
            if(videoSet) document.getElementById('input-1').setAttribute('value', videoSet);
        },
        /*on_finish: function(data) {
            // save pid
            jsPsych.data.addProperties({ 
                subject: data.responses[0]
            });
        }*/
    }

    /* Play random videos */
    // load video stimuli
    var vidStimuli = [
        '../video/1 A Hypnotic Snake.mp4', 
        '../video/1 B Drowning Woman.mp4', 
        '../video/1 C Futuristic Interrogation.mp4', 
        '../video/1 D City Zoom.mp4', 
        '../video/2 A Gift Giving.mp4', 
        '../video/2 B Mozart Symphony.mp4', 
        '../video/2 C Insect Typewriter.mp4', 
        '../video/2 D See.mp4', 
        '../video/10 A Travelling through Dreams.mp4', 
        '../video/10 B We are going to need a bigger boat.mp4', 
        '../video/10 C Sichuan Opera.mp4', 
        '../video/10 D Rifle Prayer.mp4', 
        '../video/11 A Airport Shooting.mp4',
        '../video/11 B Light Cycles.mp4', 
        '../video/11 C Subterranean Homsick Blues.mp4', 
        '../video/11 D Underwater Baby.mp4', 
        '../video/12 A The Good The Bad and the Ugly.mp4', 
        '../video/12 B Stork baby.mp4', 
        '../video/12 C Battle Preparations.mp4', 
        '../video/12 D Meeting the Holy Guardian Angel.mp4', 
        '../video/13 A Alien Contact.mp4', 
        '../video/13 B Toothache.mp4', 
        '../video/13 C The Third Man.mp4', 
        '../video/13 D Meeting the Devil.mp4', 
        '../video/14 A The Mist.mp4', 
        '../video/14 B Surfing.mp4', 
        '../video/14 C Car Crash.mp4', 
        '../video/14 D Tiger Cubs.mp4', 
        '../video/15 A City Biking.mp4', 
        '../video/15 B Lightsabre Duel.mp4', 
        '../video/15 C Falling Frogs.mp4', 
        '../video/15 D Mushroom Taking.mp4', 
        '../video/16 A Glacier Falling.mp4', 
        '../video/16 B Cheetah hunt.mp4', 
        '../video/16 C Caynon Run.mp4', 
        '../video/16 D Bubbles.mp4', 
        '../video/17 A Shoal of Fish.mp4', 
        '../video/17 B Saturn V.mp4', 
        '../video/17 C Bookshop.mp4', 
        '../video/17 D Whirling dervish.mp4', 
        '../video/18 A The Bear Necessities.mp4', 
        '../video/18 B Bank Robbery.mp4', 
        '../video/18 C Mountian Crash.mp4', 
        '../video/18 D Painted Villa.mp4', 
        '../video/19 A La Haine.mp4', 
        '../video/19 B LV-436 Approach.mp4', 
        '../video/19 C Flat Block Marina.mp4', 
        '../video/19 D Modern Times.mp4', 
        '../video/20 A Saloon Tension.mp4', 
        '../video/20 B Slurm River.mp4', 
        '../video/20 C The Terror.mp4', 
        '../video/20 D The Sorcerer’s Apprentice.mp4', 
        '../video/21 A Children of the Hydra Teeth.mp4', 
        '../video/21 B Into the Storm.mp4', 
        '../video/21 C Carpe diem.mp4', 
        '../video/21 D Swing Time.mp4', 
        '../video/22 A Braveheart.mp4', 
        '../video/22 B Must go faster.mp4', 
        '../video/22 C The paparazzi.mp4', 
        '../video/22 D Pencil Magic.mp4', 
        '../video/23 A Church swing.mp4', 
        '../video/23 B The Well of Sherif.mp4', 
        '../video/23 C Custard battle.mp4', 
        '../video/23 D Aberfan disaster.mp4', 
        '../video/24 A Tears in the rain.mp4', 
        '../video/24 B Flying Frog.mp4', 
        '../video/24 C Who dares to boo their own Chieftain.mp4', 
        '../video/24 D Dropping.mp4', 
        '../video/25 A The Derelict.mp4',

        '../video/25 D Pyramid Flyby.mp4', 
        '../video/26 A Underworld explorers.mp4', 
        '../video/26 B Affectionate Monkeys.mp4', 
        '../video/26 C Neo Interrogation.mp4', 
        '../video/26 D Chaise Longue.mp4', 
        '../video/27 A Meeting BeetleJuice.mp4',

        '../video/27 C Steam Engine.mp4',

        '../video/28 D Friendly Penguins.mp4',

        '../video/29 B Chariots of Fire.mp4', 
        '../video/29 C Jumping from Cylons.mp4', 
        '../video/29 D Time Warp.mp4'];


    var videoDisplayINT = {
        type: jsPsychSurveyHtmlForm,
        data: { test_part: 'videoRating'},
        //preamble: '<p>Now we would like you to watch two short videos and rate how similar they are to your Ganzfeld experience.</p>',
        html: '',
        button_label: 'Continue',
        on_start: function(trial) {
            //get video data of trial with test_part: videoIntro
            videoSet = jsPsych.data.get().filter({test_part: "welcome"}).values()[0].response["videoSet"];
            console.log(videoSet);

            // video indices
            var v0 = videoSet * 4;
            var v1 = videoSet * 4 + 1;
            var v2 = videoSet * 4 + 2;
            var v3 = videoSet * 4 + 3;

            // set video stimulus
            trial.html = `
            <p>Please rate the similarity of each clip to the Ganzfeld description on a scale from 0 (not at all similar) to 100 (extremely similar).</p>
            <div class="video-rating-container">
                <div class="video-container">
                    <video id="video1" controls>
                        <source src="${vidStimuli[v0]}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
                <div class="video-container">
                    <video id="video2" controls>
                        <source src="${vidStimuli[v1]}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
            </div>
            <div class="video-rating-container">
                <div class="slider-container">
                    <label for="ClipA">Clip A</label>
                    <output id="ClipA-value">50</output>
                    <input type="range" id="ClipA" name="ClipA" min="0" max="100" value="50" list="ticks1">
                    <datalist id="ticks1">
                        <option value="0" label="0"></option>
                        <option value="100" label="100"></option>
                    </datalist>
                </div>
                <div class="slider-container">
                    <label for="ClipB">Clip B</label>
                    <output id="ClipB-value">50</output>
                    <input type="range" id="ClipB" name="ClipB" min="0" max="100" value="50" list="ticks2">
                    <datalist id="ticks2">
                        <option value="0" label="0"></option>
                        <option value="100" label="100"></option>
                    </datalist>
                </div>
            </div>

            <div class="video-rating-container">
                <div class="video-container">
                    <video id="video2" controls>
                        <source src="${vidStimuli[v2]}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
                <div class="video-container">
                    <video id="video2" controls>
                        <source src="${vidStimuli[v3]}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
            </div>
            <div class="video-rating-container">
                <div class="slider-container">
                    <label for="ClipC">Clip C</label>
                    <output id="ClipC-value">50</output>
                    <input type="range" id="ClipC" name="ClipC" min="0" max="100" value="50" list="ticks1">
                    <datalist id="ticks1">
                        <option value="0" label="0"></option>
                        <option value="100" label="100"></option>
                    </datalist>
                </div>
                <div class="slider-container">
                    <label for="ClipD">Clip D</label>
                    <output id="ClipD-value">50</output>
                    <input type="range" id="ClipD" name="ClipD" min="0" max="100" value="50" list="ticks1">
                    <datalist id="ticks1">
                        <option value="0" label="0"></option>
                        <option value="100" label="100"></option>
                    </datalist>
                </div>
            </div>
            `;
        },
        on_load: function() {
            // Update output elements when sliders are changed
            document.getElementById('ClipA').addEventListener('input', function() {
                document.getElementById('ClipA-value').textContent = this.value;
            });

            document.getElementById('ClipB').addEventListener('input', function() {
                document.getElementById('ClipB-value').textContent = this.value;
            });

            document.getElementById('ClipC').addEventListener('input', function() {
                document.getElementById('ClipC-value').textContent = this.value;
            });

            document.getElementById('ClipD').addEventListener('input', function() {
                document.getElementById('ClipD-value').textContent = this.value;
            });
        }
    }

    var videoDisplay = {
        timeline: [videoDisplayINT],
        loop_function: function(data) {
            var ratingData = jsPsych.data.get().filter({test_part: "videoRating"}).values();
            if(ratingData.length > 0) {
                var lastResponse = ratingData.slice(-1)[0].response;
                if (
                    lastResponse.ClipA === lastResponse.ClipB ||
                    lastResponse.ClipA === lastResponse.ClipC ||
                    lastResponse.ClipA === lastResponse.ClipD ||
                    lastResponse.ClipB === lastResponse.ClipC ||
                    lastResponse.ClipB === lastResponse.ClipD ||
                    lastResponse.ClipC === lastResponse.ClipD
                ) {
                    alert("Please rate the videos differently.");
                    return true;
                }else {
                    return false;
                }
            } else {
                return false;
            }
        }
    }


    /* save data to csv */
    function saveData(name, data){
      var xhr = new XMLHttpRequest();
      xhr.open('POST', 'save-data6.php');
      xhr.setRequestHeader('Content-Type', 'application/json; charset=utf-8');
      xhr.send(JSON.stringify({filename: name, filedata: data}));
    }

    /* end message */
    var ending = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p>Thank you!</p><p>Your responses were recorded, you may close the window now.</p>',
        //choices: "ALL_KEYS",
        choices: "NO_KEYS",
        on_start: function() {
            // save Data
            saveData("/judge/ganzfeld_judge_" + start_time.toISOString().replace(/:\s*/g, ".") + "_" + subject_id, jsPsych.data.get().csv());
        }
    }

    /* helper */
    // preload

    var preloadVideos = {
        type: jsPsychPreload,
        message: '<p>Loading videos...</p>',
        video: '',
        on_start: function(trial) {
            videoSet = jsPsych.data.get().filter({test_part: "welcome"}).values()[0].response["videoSet"];
            // video indices
            var v0 = videoSet * 4;
            var v1 = videoSet * 4 + 1;
            var v2 = videoSet * 4 + 2;
            var v3 = videoSet * 4 + 3;

            var videos = [ vidStimuli[v0], vidStimuli[v1], vidStimuli[v2], vidStimuli[v3] ];
            trial.video = videos;
            console.log("preloading: " + videos);
        }
    }
    // fullscreen
    var enterFullscreen = {
        type: jsPsychFullscreen,
        fullscreen_mode: true
    }

    var exitFullscreen = {
        type: jsPsychFullscreen,
        fullscreen_mode: false,
        delay_after: 0
    }


    /* create timeline */
    
    //control condition
    var timeline = [];
    timeline.push(welcome);
    timeline.push(preloadVideos);
    timeline.push(videoDisplay);
    //timeline.push(ending);

    /* start the experiment */
    jsPsych.run(timeline);


  </script>
</html>
