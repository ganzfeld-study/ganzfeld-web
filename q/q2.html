                </ul>

            "language_prompt": "Sprache"
        },
        "se": {
            "preamble": `<h2>Session 2</h2>
            <div style="text-align:justify">
                <p>Under den här sista sessionen tillfrågas du att delta i ett Ganzfeld-experiment. Du kommer att bli ombedd att önska att du under Ganzfeld kommer att få upplevelser som är relaterade till ett filmklipp som kommer att visas för dig senare. Specifikt kommer du att bli ombedd att:</p>
                <ul>
                    <li>Svara på några frågor om din inställning till experimentet.</li>
                    <li>Vila i en fåtölj i några minuter och svara på några frågor om denna upplevelse.</li>
                    <li>Göra Ganzfeld-experimentet. Detta kommer att omfatta 7 minuters avslappningsinstruktioner följt av 30 minuters Ganzfeld. Under dessa 30 minuter kommer du att bli ombedd att rapportera dina upplevelser (dvs, tänka högt)</li>
                    <li>Efter att ha besvarat några frågor bland annat om din Ganzfeld-upplevelse får du titta på två korta filmklipp, varav det ena är ”måltavlan” som kommer att visas för dig igen senare. Du kommer att bli ombedd att bedöma dessa två klipp med avseende på deras likhet med din Ganzfeld-upplevelse. Sedan visas måltavlan för dig.</li>
                </ul>

                <p>Fyll i ditt deltagar-ID / kontrollera att det är korrekt och klicka på <i>Nästa</i> för att börja.</p>`,

    questions: [
        {

            name: 'subject_id'
        }

    button_label: function() { return txt(txt_survey, lang, 'next'); },
    on_load: function(){
        var input = document.getElementById('input-0');
        var continueBtn = document.getElementById('jspsych-survey-text-next');
        var langSelect = document.getElementById('language-select');

        if (pid) {
            input.setAttribute('value', pid);
        } else if (lab) {
            input.setAttribute('value', lab + "_");
            input.selectionStart = input.selectionEnd = input.value.length;
            input.style.border = '2px solid red';
            input.style.outline = 'none';
            continueBtn.disabled = true;
        }

        input.addEventListener('input', function() {
            if (input.value.length == 8) {
                input.style.border = '2px solid #ccc';
                continueBtn.disabled = false;
            } else {
                input.style.border = '2px solid red';
                continueBtn.disabled = true;
            }
        });

        // Change language and reload the experiment
        langSelect.addEventListener('change', function() {
            var newLang = langSelect.value;
            var url = new URL(window.location.href);
            url.searchParams.set('lang', newLang);
            window.location.href = url.href; // Reload with new language parameter
        });
    },
    on_finish: function(data){
        subject_id = data.response.subject_id;
        jsPsych.data.addProperties({ 
            subject: subject_id
        });
    }
};

    /* Instructions */
    var txt_instr1 = {
        "en": {
            "page1": `<h2>General Guidelines (Ganzfeld)</h2>
            <p>During the 30 min of ganzfeld experience (after the relaxation), you are asked to say out loud everything that you experience. These experiences are referred to as “mentations”. You will be asked to compare them to a target film clip that will be selected after your ganzfeld experience. <b>Please make the intention to obtain the information of the target film clip.</b></p>
            <p style="text-align: left;"><b>Read carefully the guidelines below on what to report during the ganzfeld:</b></p>
            <ol style="text-align: left;">
                <li>Say out loud everything that you experience: all sensations, mental imagery, auditory impressions, colors, etc.</li>
                <li>Do not screen anything, say it all, regardless of how trivial it may seem to you. If you have an impression that you would rather not share others, just state it generally.</li>
                <li>Do not worry if an impression is vague, indistinct, or nonsensical. Describe it as best you can in terms of its shape, form, color, or whatever. DO NOT wait for the image to develop into a recognizable image. Simply describe the initial image as best you can.</li>
                <li>Try not to be caught up in following your ordinary, normal trains of thought or chains of association, but remain open to whatever may arise in your mind.</li>
                <li>After stating an impression, let it “go” and wait for another new one to occur. If a particular image occurs again or is very persistent, simply acknowledge that this is happening, and then move on to the next one.</li>
                <li>Notice if anything coming to your mind stands out for any reason.</li>
            </ol>`,
        },
        "de": {
            "page1": `<h2>Allgemeine Hinweise (Ganzfeld)</h2>
            <p>Während der 30-minütigen Ganzfelderfahrung (nach der Entspannung) werden Sie gebeten, alles, was Sie erleben, laut auszusprechen. Sie werden anschließend gebeten, diese Erfahrungen mit einem Ziel-Filmausschnitt zu vergleichen, der nach der Ganzfeld-Übung ausgewählt wird. <b>Bitte nehmen Sie sich vor, Informationen über den Filmausschnitt zu erhalten.</b></p>
            <p style="text-align: left;"><b>Lesen Sie sorgfältig die nachstehenden Hinweise darüber, was Sie während des Ganzfeldes berichten sollen:</b></p>
            <ol style="text-align: left;">
                <li>Sprechen Sie alles laut aus, was Sie erleben: alle Empfindungen, mentalen Bilder, Höreindrücke, Farben, usw.</li>
                <li>Blenden Sie nichts aus, sagen Sie alles, egal wie trivial es Ihnen erscheinen mag. Wenn Sie einen Eindruck haben, den Sie lieber nicht mit anderen teilen möchten, sprechen Sie ihn einfach ganz allgemein aus.</li>
                <li>Sorgen Sie sich nicht, wenn ein Eindruck vage, undeutlich oder unsinnig ist. Beschreiben Sie ihn so gut wie möglich in Form von Gestalt, Form, Farbe oder was auch immer. Warten Sie NICHT darauf, dass sich das Bild zu etwas Konkretem, Erkannbarem entwickelt. Beschreiben Sie einfach das ursprüngliche Bild, so gut es geht.</li>
                <li>Versuchen Sie, nicht Ihren üblichen, normalen Gedankengängen oder Assoziationsketten zu folgen, sondern bleiben Sie offen für alles, was in Ihrem Bewusstsein auftauchen mag.</li>
                <li>Nachdem Sie einen Eindruck beschrieben haben, lassen Sie ihn „gehen“ und warten Sie darauf, dass ein neuer auftaucht. Wenn ein bestimmtes Bild wieder auftaucht oder sehr hartnäckig ist, erkennen Sie einfach an, dass dies geschieht, und gehen Sie dann zum nächsten über.</li>
                <li>Beobachten Sie, ob Ihnen etwas bewusst wird, das aus irgendeinem Grund besonders auffällt.</li>
            </ol>`,
        },
        "se": {
            "page1": `<h2>Instruktioner gällande ganzfeld-rapporten</h2>
            <p>Under den 30 minuter långa ganzfeld-upplevelsen (efter avslappningen) ombeds du att säga högt allt som rör sig i ditt huvud. Du kommer att bli ombedd att jämföra dem med ett filmklipp som kommer att väljas ut som ”måltavla” (”target”) efter din ganzfeld-upplevelse. <b>Ha för avsikt att inhämta information om det filmklipp som blir din måltavla.</b></p>
            <p style="text-align: left;"><b>Läs noga igenom riktlinjerna nedan om vad du ska rapportera under ganzfeld:</b></p>
            <ol style="text-align: left;">
                <li>Säg högt allt du upplever: alla sinnesintryck, mentala bilder, hörselintryck, färger osv.</li>
                <li>Filtrera inte bort någonting, säg allt, oavsett hur trivialt det kan verka för dig. Om du har ett intryck som du helst inte vill dela med andra, säg det bara generellt.</li>
                <li>Oroa dig inte för om ett intryck är vagt, otydligt eller meningslöst. Beskriv det så gott du kan i termer av form, färg eller vad det nu kan vara. VÄNTA INTE på att bilden ska utvecklas till en igenkännbar bild. Beskriv helt enkelt den första bilden så gott du kan.</li>
                <li>Försök att inte fastna i att följa dina vanliga, normala tankebanor eller associationskedjor, utan var öppen för vad som än kan dyka upp i ditt sinne.</li>
                <li>När du har berättat om ett intryck, ”släpp det” och vänta på att ett nytt intryck ska uppstå. Om en viss bild återkommer eller är mycket påträngande, konstatera helt enkelt att det händer och gå sedan vidare till nästa.</li>
                <li>Lägg märke till om något som du kommer att tänka på sticker ut av någon anledning.</li>
            </ol>`,

            var rnd1 = videoData.rndSet * 4 + videoData.rndV1;

            // video 2 index
            var rnd2 = videoData.rndSet * 4 + videoData.rndV2;

            // set video stimulus
            trial.html = `
            <p>${ txt(txt_video, lang, 'videoRating') }</p>
            <div class="video-rating-container">
                <div class="video-container">
                    <video id="video1" controls>
                        <source src="${vidStimuli[rnd1]}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
                <div class="video-container">
                    <video id="video2" controls>
                        <source src="${vidStimuli[rnd2]}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
            </div>
                <div class="video-rating-container">
                <div class="slider-container">
                    <label for="ClipA">Clip A</label>
                    <output id="ClipA-value">50</output>
                    <input type="range" id="ClipA" name="ClipA" min="0" max="100" value="50" list="ticks1">
                    <datalist id="ticks1">
                        <option value="0" label="0"></option>
                        <option value="100" label="100"></option>
                    </datalist>
                </div>
                <div class="slider-container">
                    <label for="ClipB">Clip B</label>
                    <output id="ClipB-value">50</output>
                    <input type="range" id="ClipB" name="ClipB" min="0" max="100" value="50" list="ticks2">
                    <datalist id="ticks2">
                        <option value="0" label="0"></option>
                        <option value="100" label="100"></option>
                    </datalist>
                </div>
            </div>
            <p id="duplicate-message" style="color: red;"></p>
            `;
        },
        on_load: function() {
            function checkDuplicateValues() {
                const values = [];
                values.push(document.getElementById('ClipA').value);
                values.push(document.getElementById('ClipB').value);

                const uniqueValues = new Set(values);

                if (values.length - uniqueValues.size >= 1) {
                    document.getElementById('duplicate-message').textContent = "Please rate the videos differently";
                    document.getElementById('jspsych-survey-html-form-next').disabled = true;
                } else {
                    document.getElementById('duplicate-message').textContent = "";
                    document.getElementById('jspsych-survey-html-form-next').disabled = false;
                }
            }

            checkDuplicateValues();

            // Update output elements when sliders are changed
            document.getElementById('ClipA').addEventListener('input', function() {
                document.getElementById('ClipA-value').textContent = this.value;
                checkDuplicateValues();
            });

            document.getElementById('ClipB').addEventListener('input', function() {
                document.getElementById('ClipB-value').textContent = this.value;
                checkDuplicateValues();
            });
        }
    }

    var videoDisplay = {
        timeline: [videoDisplayINT],
        loop_function: function(data) {
            var ratingData = jsPsych.data.get().filter({test_part: "videoRating"}).values();
            if(ratingData.length > 0) {
                if(ratingData.slice(-1)[0].response.ClipA == ratingData.slice(-1)[0].response.ClipB) {
                    alert("Please rate the videos differently.");
                    return true;
                } else {
                    return false;
                }
            } else {
                return false;
            }
        }
    }

    var videoTargetIntro = {
        type: jsPsychHtmlButtonResponse,
        data: { test_part: 'videoTargetIntro', videoStimulus: ''},
        stimulus: txt(txt_video, lang, 'videoTarget'),
        choices: [txt(txt_survey, lang, 'next')],
        on_finish(data) {
            //get video data of trial with test_part: videoIntro
            var videoData = jsPsych.data.get().filter({test_part: "videoIntro"}).values()[0];

            // decide the target video
            var Z = parseInt(Zufallswert(), 10);

            if(Z == 0) var t = videoData.rndSet * 4 + videoData.rndV1;
            else var t = videoData.rndSet * 4 + videoData.rndV2;

            // set video stimulus
            data.videoStimulus = [ vidStimuli[t] ];

            // save data in case participants are unhappy with result
            saveData("/session2/ganzfeld_2_" + start_time.toISOString().replace(/:\s*/g, ".") + "_" + subject_id, jsPsych.data.get().csv());
        }
    }
    var videoTarget = {
        type: jsPsychVideoKeyboardResponse,
        data: { test_part: 'videoTarget'},
        stimulus: [
            ''
        ],
        choices: "NO_KEYS",
        controls: true,
        trial_ends_after_video: true,
        post_trial_gap: 500,
        on_start: function(trial) {
            //get video data of trial with test_part: videoIntro

            var videoStimulus = jsPsych.data.get().filter({test_part: "videoTargetIntro"}).trials[0].videoStimulus;

            // set video stimulus
            trial.stimulus = videoStimulus;

        }
    };

    /* save data to csv */
    function saveData(name, data){
      var xhr = new XMLHttpRequest();
      xhr.open('POST', 'save-data6.php');
      xhr.setRequestHeader('Content-Type', 'application/json; charset=utf-8');
      xhr.send(JSON.stringify({filename: name, filedata: data}));
    }

    /* end message */
    var txt_ending = {
        "en": {
            "ending": `<p>Thank you!</p><p>Your responses were recorded, you may close the window now.</p>`
        },
        "de": {
            "ending": `<p>Vielen Dank!</p><p>Ihre Antworten wurden aufgezeichnet, Sie können das Fenster jetzt schließen.</p>`
        },
        "se": {
            "ending": `<p>Tack så mycket!</p><p>Dina svar är registrerade, du kan nu stänga ned fönstret.</p>`
        }
    }
    var ending = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: txt(txt_ending, lang, 'ending'),
        //choices: "ALL_KEYS",
        choices: "NO_KEYS",
        // on_start: function() {
        //     // save Data
        //     saveData("/session2/ganzfeld_2_" + start_time.toISOString().replace(/:\s*/g, ".") + "_" + subject_id, jsPsych.data.get().csv());
        // }
    }

    /* helper */
    // preload
    var preload = {
        type: jsPsychPreload,
        auto_preload: true
    }
    var preloadVideos = {
        type: jsPsychPreload,
        message: '<p>Loading videos...</p>',
        video: '',
        on_start: function(trial) {
            var videoData = jsPsych.data.get().filter({test_part: "videoIntro"}).values()[0];
            var rndSet = videoData.rndSet;
            var rndV1 = videoData.rndV1;
            var rndV2 = videoData.rndV2;

            var rnd1 = rndSet * 4 + rndV1;
            var rnd2 = rndSet * 4 + rndV2;

            var videos = [ vidStimuli[rnd1], vidStimuli[rnd2] ];
            trial.video = videos;
            console.log("preloading: " + videos);
        }
    }
    // fullscreen
    // var enterFullscreen = {
    //     type: jsPsychFullscreen,
    //     fullscreen_mode: true
    // }

    // var exitFullscreen = {
    //     type: jsPsychFullscreen,
    //     fullscreen_mode: false,
    //     delay_after: 0
    // }

    var hide_cursor = {
         type: jsPsychCallFunction,
         func: function(){
            document.querySelector('head').insertAdjacentHTML('beforeEnd', '<style id="hide-cursor">body { cursor: none; }</style>');
         }
      };
  
      var show_cursor = {
         type: jsPsychCallFunction,
         func: function(){
            document.querySelector('#hide-cursor').remove();
         }
      };*/

    /* create timeline */
    
    //control condition
    var timeline = [];
    timeline.push(preload);
    timeline.push(testrun);
    timeline.push(welcome);
    timeline.push(instructions1);
    timeline.push(surveyPreSB);
    timeline.push(surveyPreComf);
    timeline.push(restIntro);
    timeline.push(restPlay);
    timeline.push(surveyPCIRest);
    timeline.push(ganzfeldIntro);
    timeline.push(ganzfeldPlay);
    timeline.push(surveyPCIGanzfeld);
    timeline.push(surveyDSSQ);
    timeline.push(timeEstimate1);
    timeline.push(timeEstimate2);
    timeline.push(instructions2);
    timeline.push(videoIntro);
    timeline.push(preloadVideos);
    timeline.push(videoDisplay);
    timeline.push(videoTargetIntro);
    timeline.push(videoTarget);
    timeline.push(ending);

    /* start the experiment */
    jsPsych.run(timeline);


  </script>
