        stimulus:  function(){
            // Create an AudioContext
            var audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            // Create an oscillator node
            var oscillator = audioCtx.createOscillator();

            // Set the oscillator type to 'sine' for a simple beep sound
            oscillator.type = 'sine';

            // Set the frequency of the oscillator (adjust for desired pitch)
            oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); // 440 Hz is a standard pitch for an "A" note

            // Connect the oscillator to the audio context's destination (speakers)
            oscillator.connect(audioCtx.destination);

            // Start the oscillator after 3 minutes
            setTimeout(function(){
            oscillator.start();
            }, 180000); // 180000 milliseconds = 3 minutes

            oscillator.stop();
            }, 182000); // Stop 2000 milliseconds after starting
