    <style>
        /* Spinner for Audio Playback */
        .playaudio {
        width: 48px;
        height: 48px;
        display: inline-block;
        position: relative;
        }
        .playaudio::after,
        .playaudio::before {
        content: '';  
        box-sizing: border-box;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid #000;
        position: absolute;
        left: 0;
        top: 0;
        animation: animloader 2s linear infinite;
        }
        .playaudio::after {
        animation-delay: 1s;
        }

        @keyframes animloader {
        0% {
            transform: scale(0);
            opacity: 1;
        }
        100% {
            transform: scale(1);
            opacity: 0;
        }
        }

    </style>

    //initialize Experiment
    const jsPsych = initJsPsych({

    let lab = jsPsych.data.urlVariables()['l'];
    
    var subject_id = jsPsych.randomization.randomID(16);

    console.log(" Lab: " + lab + " Language: " + lang);

    var start_time = new Date();

    jsPsych.data.addProperties({ 
        subject: subject_id,

    // Function to retrieve text based on language and key
    function txt(translations, language, key) {
        if (translations.hasOwnProperty(language) && translations[language].hasOwnProperty(key)) {
            return translations[language][key];
        } else {
            // Return default text or empty string if translation not found
            return 'No translation found.';
        }
    }
